<div #pdfContent class="opsp-format-page relative w-full max-w-7xl mx-auto p-6 sm:p-10 space-y-10" [appPermissionEditLock]="6">
    <app-opsp-entity-filter></app-opsp-entity-filter>
    <div *ngIf="canExportPdf" class="print-hide absolute top-6 right-6 sm:top-10 sm:right-10 z-10 flex items-center gap-2">
      <button type="button" (click)="exportExcel()"
        class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2 px-4 rounded-xl shadow">
        Excel
      </button>
      <button type="button" (click)="exportPdf()"
        class="bg-red-600 hover:bg-red-700 text-white text-sm font-medium py-2 px-4 rounded-xl shadow">
        PDF
      </button>
    </div>
    <!-- Encabezado -->
    <div class="text-center">
      <h2 class="text-3xl font-extrabold text-[#003660]">BHAG®</h2>
      <p class="mt-1 text-sm text-gray-500">
        Define tu meta audaz, ambiciosa y a largo plazo
      </p>
    </div>
  
    <!-- Card -->
    <div class="bg-white shadow-sm border border-gray-200 rounded-2xl p-6 space-y-6">
  
      <!-- Descripción -->
      <div>
        <label class="block text-lg font-semibold text-[#003660] mb-2">BHAG®</label>
        <textarea
          [(ngModel)]="form.description"
          rows="5"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#56B4DA]"
          placeholder="Describe tu BHAG® con mayor detalle..."
        ></textarea>
      </div>
    </div>
  
    <!-- Botón Guardar -->
  <div class="text-right">
      <button
        (click)="save()" [appPermissionHideIfNoEdit]="6"
        class="bg-[#003660] hover:bg-[#005f8c] text-white font-medium py-2 px-6 rounded-xl shadow"
      >
        Guardar
      </button>
    </div>
  </div>
  
  <div #pdfReportContent class="w-[1100px] bg-white text-slate-900 p-10 space-y-8" style="position:absolute;left:-99999px;top:0;">
    <div class="border-b border-slate-200 pb-4">
      <p class="text-xs font-semibold uppercase tracking-[0.3em] text-slate-500">OPSP</p>
      <h1 class="mt-2 text-3xl font-bold text-[#003660]">BHAG</h1>
      <p class="mt-2 text-sm text-slate-600">Meta audaz, ambiciosa y de largo plazo.</p>
    </div>

    <div class="rounded-2xl border border-slate-200 p-6">
      <h2 class="text-lg font-semibold text-[#003660]">Declaracion principal</h2>
      <p class="mt-4 whitespace-pre-wrap text-base leading-7 text-slate-700">{{ form.description || ' ' }}</p>
    </div>
  </div>
