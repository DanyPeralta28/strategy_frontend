<div class="max-w-4xl mx-auto px-6 py-10 space-y-10">

  <!-- Encabezado -->
  <div class="text-center">
    <h2 class="text-3xl font-extrabold text-[#003660]">Valores Centrales</h2>
    <p class="mt-2 text-sm text-gray-500">Define los principios esenciales que guían a tu organización</p>
  </div>

  <!-- Lista de Valores -->
  <div class="space-y-6">
    <div *ngFor="let valor of valores; let i = index" class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 space-y-4">

      <div class="flex justify-between items-center">
        <h3 class="text-sm font-semibold text-[#003660]">Valor #{{ i + 1 }}</h3>
        <button *ngIf="valores.length > 1" (click)="eliminarValor(i)"
          class="text-red-600 hover:text-red-800 text-sm font-medium">
          Eliminar
        </button>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Valor (palabra o frase)</label>
        <input [(ngModel)]="valor.nombre" type="text"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#56B4DA]" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Explicación corta</label>
        <input [(ngModel)]="valor.corta" type="text"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#56B4DA]" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Explicación larga</label>
        <textarea [(ngModel)]="valor.larga" rows="4"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#56B4DA] resize-none"></textarea>
      </div>
    </div>

    <!-- Botón agregar -->
    <div class="text-center pt-4">
      <button (click)="agregarValor()"
        class="bg-[#003660] hover:bg-[#005f8c] text-white font-medium py-2 px-6 rounded-xl shadow">
        + Agregar otro Valor
      </button>
    </div>
  </div>

  <!-- Botón Guardar -->
  <div class="text-right pt-6">
    <button (click)="guardarValores()"
      class="bg-[#003660] hover:bg-[#005f8c] text-white font-medium py-2 px-6 rounded-xl shadow">
      Guardar
    </button>
  </div>
</div>
