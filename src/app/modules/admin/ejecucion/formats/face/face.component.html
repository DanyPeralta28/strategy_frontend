<!-- CONTENEDOR GENERAL -->
<div class="w-full">
  <!-- Hero / Encabezado -->
  <section class="bg-[#F3F7FB] border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 md:px-10 py-8 text-center">
      <h1 class="text-[32px] leading-tight font-extrabold text-[#0b2a45]">FACE</h1>
      <p class="text-slate-500 mt-1">
        Cuadro de Funciones y Responsabilidad
      </p>
    </div>
  </section>

  <!-- CUERPO -->
  <div class="max-w-7xl mx-auto px-6 md:px-10 py-8">
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
      <!-- Encabezado de tabla -->
      <div class="bg-[#08365A] text-white text-sm md:text-base font-semibold px-4 md:px-6 py-3 sticky top-0 z-10">
        <div class="grid grid-cols-12 gap-3 items-center">
          <div class="col-span-12 md:col-span-3">Funciones</div>
          <div class="col-span-12 md:col-span-3">Accountable</div>
          <div class="col-span-12 md:col-span-3">KPIs</div>
          <div class="col-span-12 md:col-span-3">Resultados</div>
        </div>
      </div>

      <!-- Filas -->
      <div class="divide-y divide-slate-100">
        <div *ngFor="let f of funciones; let i = index" class="px-4 md:px-6 py-4 bg-white hover:bg-slate-50 transition">
          <div class="grid grid-cols-12 gap-3">
            <!-- Función -->
            <div class="col-span-12 md:col-span-3">
              <input [(ngModel)]="f.nombre"
                     class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-700
                            focus:outline-none focus:ring-2 focus:ring-[#56B4DA]"
                     placeholder="Ej: Mercadotecnia" />
            </div>

            <!-- Accountable -->
            <div class="col-span-12 md:col-span-3">
              <input [(ngModel)]="f.accountable"
                     class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-700
                            focus:outline-none focus:ring-2 focus:ring-[#56B4DA]"
                     placeholder="Ej: Juan Pérez" />
            </div>

            <!-- KPIs -->
            <div class="col-span-12 md:col-span-3">
              <div class="flex flex-wrap gap-2 mb-2">
                <span *ngFor="let k of f.kpis; let ki = index"
                      class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold text-white"
                      [ngClass]="chipColor(ki)">
                  {{ k }}
                  <button (click)="removeKpi(i, ki)" class="opacity-80 hover:opacity-100">✕</button>
                </span>
              </div>
              <input
                class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-700
                       focus:outline-none focus:ring-2 focus:ring-[#56B4DA]"
                placeholder="Agregar KPI"
                (keyup.enter)="addKpi(i, $event)" />
            </div>

            <!-- Resultados -->
            <div class="col-span-12 md:col-span-3">
              <div class="flex flex-wrap gap-2 mb-2">
                <span *ngFor="let r of f.resultados; let ri = index"
                      class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold text-white"
                      [ngClass]="chipColor(ri)">
                  {{ r }}
                  <button (click)="removeResultado(i, ri)" class="opacity-80 hover:opacity-100">✕</button>
                </span>
              </div>
              <input
                class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-700
                       focus:outline-none focus:ring-2 focus:ring-[#56B4DA]"
                placeholder="Agregar Resultado"
                (keyup.enter)="addResultado(i, $event)" />
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="px-4 md:px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-between items-center">
        <p class="text-xs text-slate-500"></p>
        <button (click)="addFuncion()"
                class="inline-flex items-center gap-2 bg-[#0b3b63] hover:bg-[#0d4674]
                       text-white font-semibold px-4 py-2 rounded-lg transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          Agregar función
        </button>
      </div>
    </div>
  </div>
</div>
