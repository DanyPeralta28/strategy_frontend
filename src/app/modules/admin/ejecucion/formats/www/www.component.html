<div class="w-full" [appPermissionEditLock]="22">
    <!-- Hero -->
    <section class="bg-[#F3F7FB] border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 md:px-10 py-8 text-center">
            <h1 class="text-[32px] leading-tight font-extrabold text-[#0b2a45]">WWW</h1>
            <p class="text-slate-500 mt-1">Seguimiento de responsabilidades</p>
        </div>
    </section>

    <div class="max-w-7xl mx-auto px-6 md:px-10 py-8">
        <!-- Filtros -->
        <div class="permission-ignore-edit flex flex-wrap items-center justify-between gap-3 mb-4">
            <div class="flex flex-wrap items-center gap-2 text-sm font-semibold text-slate-600">
                <span [class.text-slate-900]="!modoReunion">Modo normal</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" class="sr-only peer" [(ngModel)]="modoReunion" (change)="onModoChange()" />
                    <div
                        class="w-12 h-6 bg-slate-300 rounded-full peer peer-checked:bg-emerald-600 transition-colors"></div>
                    <div
                        class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-6">
                    </div>
                </label>
                <span [class.text-slate-900]="modoReunion">Modo reunión</span>
            </div>

            <div class="flex items-center gap-2">
                <span class="text-sm font-semibold text-slate-600">Target</span>
                <select [(ngModel)]="targetSeleccionado" (change)="onTargetChange()"
                        class="px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-700 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-[#56B4DA]">
                    <option *ngFor="let t of targetOptions" [value]="t.value">{{ t.label }}</option>
                </select>
            </div>

            <div class="relative" *ngIf="!modoReunion">
                <button type="button"
                        (click)="toggleEstadosDropdown()"
                        class="inline-flex items-center gap-2 px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-700 text-sm font-semibold hover:bg-slate-50">
                    Estados
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>

                <div *ngIf="showEstadosDropdown"
                     class="absolute right-0 mt-2 w-52 rounded-lg border border-slate-200 bg-white shadow-lg p-3 z-20">
                    <div class="text-xs font-semibold text-slate-500 mb-2">Filtrar estados</div>
                    <label *ngFor="let e of estadosFiltro" class="flex items-center gap-2 py-1 text-sm text-slate-700">
                        <input type="checkbox"
                               class="h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500"
                               [checked]="estadosSeleccionados.includes(e)"
                               (change)="toggleEstadoFiltro(e)" />
                        <span>{{ e }}</span>
                    </label>
                </div>
            </div>
        </div>
        <!-- OJO: overflow-visible para que los menús no se corten -->
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-visible rounded-t-2xl">

            <!-- Header de la tabla (grid re-balanceado) -->
            <div class="bg-[#08365A] text-white text-sm md:text-base font-semibold px-3 md:px-6 py-3 rounded-t-2xl">
                <div class="grid grid-cols-12 gap-2 items-center">
                    <div class="col-span-3">QUÉ</div>
                    <div class="col-span-3">QUIÉN</div>
                    <div class="col-span-2">CUÁNDO</div>
                    <div class="col-span-1">ESTADO</div>
                    <div class="col-span-2">NUEVO CUÁNDO</div>
                    <div class="col-span-1 text-right">ACCIONES</div>
                </div>
            </div>

            <!-- Filas -->
            <div class="divide-y divide-slate-100">
                <div *ngFor="let r of filas; let i = index; trackBy: trackByIndex"
                    class="px-3 md:px-6 py-3 bg-white hover:bg-slate-50 transition">
                    <div class="grid grid-cols-12 gap-2 items-center">

                        <div class="col-span-3">
                            <input [(ngModel)]="r.que" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-700
                            focus:outline-none focus:ring-2 focus:ring-[#56B4DA]"
                                placeholder="Describe la acción / entrega" />
                        </div>

                        <div class="col-span-3">
                            <input [(ngModel)]="r.quien" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-700
                            focus:outline-none focus:ring-2 focus:ring-[#56B4DA]" placeholder="Ej: Julio An leu" />
                        </div>

                        <div class="col-span-2">
                            <input type="date" [(ngModel)]="r.cuando" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-700
                            focus:outline-none focus:ring-2 focus:ring-[#56B4DA]" />
                        </div>

                        <div class="col-span-1 relative z-20">
                            <div class="flex items-center gap-2">
                                <select [(ngModel)]="r.estado"
                                    class="w-full px-2 py-2 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-[#56B4DA]"
                                    [ngClass]="estadoSelectClass(r.estado)">
                                    <option *ngFor="let e of estados" [value]="e">{{ e || 'Seleccionar' }}</option>
                                </select>
                            </div>
                        </div>

                        <div class="col-span-2">
                            <input type="date" [(ngModel)]="r.nuevoCuando" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-700
                            focus:outline-none focus:ring-2 focus:ring-[#56B4DA]" />
                        </div>

                        <div class="col-span-1 flex justify-end">
                            <button (click)="removeRow(i)"
                                class="h-10 w-10 rounded-full bg-rose-100 hover:bg-rose-200 text-rose-700 font-semibold flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 6h18M8 6V4h8v2m-9 3h10l-1 12H8L7 9z" />
                                </svg>
                            </button>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Footer acciones -->
            <div
                class="px-3 md:px-6 py-4 bg-slate-50 border-t border-slate-200 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                <p class="text-xs text-slate-500">
                    Registra <strong>Qué</strong> (acción), <strong>Quién</strong> (responsable),
                    <strong>Cuándo</strong> (fecha),
                    su <strong>Estado</strong> y, si se reprograma, <strong>Nuevo Cuándo</strong>.
                </p>
                <div class="flex gap-2">
                    <button (click)="addRow()" class="inline-flex items-center gap-2 bg-[#0b3b63] hover:bg-[#0d4674]
                         text-white font-semibold px-4 py-2 rounded-lg transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        Agregar fila
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Boton flotante de guardado -->
<div class="fixed bottom-6 right-6 z-50">
    <button (click)="guardar()" [appPermissionHideIfNoEdit]="22"
        class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-3 rounded-full shadow-lg transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        Guardar WWW
    </button>
</div>
