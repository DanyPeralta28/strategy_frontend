<!-- CONTENEDOR GENERAL -->
<div class="w-full">
  <!-- Hero / Encabezado -->
  <section class="bg-[#F3F7FB] border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 md:px-10 py-8 text-center">
      <h1 class="text-[32px] leading-tight font-extrabold text-[#0b2a45]">PACE</h1>
      <p class="text-slate-500 mt-1">Cuadro de Procesos y Responsabilidad</p>
    </div>
  </section>

  <!-- CUERPO -->
  <div class="max-w-7xl mx-auto px-6 md:px-10 py-8">
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
      <!-- Encabezado -->
      <div class="bg-[#08365A] text-white text-sm md:text-base font-semibold px-4 md:px-6 py-3 sticky top-0 z-10">
        <div class="grid grid-cols-12 gap-3 items-center">
          <div class="col-span-12 md:col-span-5">Nombre del Proceso</div>
          <div class="col-span-12 md:col-span-3">Responsable</div>
          <div class="col-span-12 md:col-span-4">KPIs</div>
        </div>
      </div>

      <!-- Filas -->
      <div class="divide-y divide-slate-100">
        <div *ngFor="let p of items; let i = index" class="px-4 md:px-6 py-4 bg-white hover:bg-slate-50 transition">
          <div class="grid grid-cols-12 gap-3 items-start md:items-center">
            <!-- Proceso -->
            <div class="col-span-12 md:col-span-5">
              <input [(ngModel)]="p.process_name"
                     class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-700
                            focus:outline-none focus:ring-2 focus:ring-[#56B4DA]"
                     placeholder="Ej: Facturación" />
            </div>

            <!-- Responsable -->
            <div class="col-span-12 md:col-span-3">
              <input [(ngModel)]="p.person_in_charge_name"
                     class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-700
                            focus:outline-none focus:ring-2 focus:ring-[#56B4DA]" placeholder="Ej: Ana Pérez" />
            </div>

            <!-- KPIs -->
            <div class="col-span-12 md:col-span-3">
              <div class="flex flex-wrap gap-2 mb-2">
                <span *ngFor="let k of p.kpi_list; let ki = index"
                      class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold text-white"
                      [ngClass]="chipColor(ki)">
                  {{ k.kpi }}
                  <button (click)="removeKpi(i, ki)" class="opacity-80 hover:opacity-100">×</button>
                </span>
              </div>
              <div class="flex gap-2">
                <input class="flex-1 px-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-700
                              focus:outline-none focus:ring-2 focus:ring-[#56B4DA]"
                       placeholder="KPI" (keyup.enter)="addKpi(i, $event)" />
              </div>
            </div>

            <!-- Acciones -->
            <div class="col-span-12 md:col-span-1 flex md:justify-end items-center">
              <button (click)="eliminarFila(i)"
                      class="h-10 w-10 rounded-full bg-rose-100 hover:bg-rose-200 text-rose-700 font-semibold flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6h18M8 6V4h8v2m-9 3h10l-1 12H8L7 9z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="px-4 md:px-6 py-4 bg-slate-50 border-t border-slate-200 flex flex-col md:flex-row md:justify-between md:items-center gap-3">
        <p class="text-xs text-slate-500" *ngIf="loading">Cargando PACE...</p>
        <div class="flex flex-wrap gap-2 justify-end">
          <button (click)="addItem()"
                  class="inline-flex items-center gap-2 bg-[#0b3b63] hover:bg-[#0d4674] text-white font-semibold px-4 py-2 rounded-lg transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Agregar proceso
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Boton flotante de guardado -->
<div class="fixed bottom-6 right-6 z-50">
  <button (click)="guardarNuevos()"
          class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-3 rounded-full shadow-lg transition">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
    Guardar PACE
  </button>
</div>
