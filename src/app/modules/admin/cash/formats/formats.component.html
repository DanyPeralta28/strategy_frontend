<div class="p-6 sm:p-10">
    <h2 class="text-2xl font-bold mb-8 text-[#003660]">Formatos Cash</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <div *ngFor="let formato of formatos"
             class="bg-white rounded-2xl border border-[#003660] shadow-md hover:shadow-lg transition-all p-6 flex flex-col justify-between h-full">
            <div>
                <h3 class="text-lg font-semibold text-[#003660]">{{ formato.nombre }}</h3>
                <p class="text-sm text-[#A0AEC0] mt-2">{{ formato.descripcion }}</p>
            </div>
            <div class="mt-4">
                <button
                    (click)="goFormat(formato.link)"
                    class="w-full py-2 px-4 text-sm font-medium text-white bg-[#003660] hover:bg-[#5FB1E7] rounded-xl transition-all">
                    Configurar
                </button>
            </div>
        </div>
    </div>
</div>
